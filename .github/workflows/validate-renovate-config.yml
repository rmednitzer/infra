name: Validate Renovate config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read


# Coalesce initial PR attempts; isolate reruns and retain non-PR evidence.
concurrency:
  group: >-
    validate-renovate-config-${{ github.workflow }}-${{ github.event_name }}-${{
    github.run_attempt == '1' && github.event.pull_request.number || github.run_id
    }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  validate:
    name: Validate renovate preset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test dependency pin discovery and update policy
        run: python -m unittest discover -s tests -p "test_renovate_preset.py"

      - name: Check whether renovate config changed
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable diff base, validating to be safe."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "${{ github.sha }}" -- renovate.json5 .github/workflows/validate-renovate-config.yml tests/test_renovate_preset.py | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.relevant == 'true'
        with:
          node-version: '24'

      - name: Schema and syntax check (renovate.json5)
        if: steps.check.outputs.relevant == 'true'
        run: npx --yes --package renovate@44.167.6 -- renovate-config-validator --no-global --strict renovate.json5

      - name: Full local policy resolution and extraction check
        if: steps.check.outputs.relevant == 'true'
        env:
          RENOVATE_CONFIG_FILE: renovate.json5
        run: npx --yes --package renovate@44.167.6 -- renovate --platform=local --dry-run=extract --exit-code-for-errors
