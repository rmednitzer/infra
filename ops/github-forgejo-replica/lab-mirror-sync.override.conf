[Unit]
OnFailure=mcp-unit-failed@%n.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/github-forgejo-replica-sync --config /etc/github-forgejo-replica/config.json
ExecStopPost=+/usr/local/sbin/github-forgejo-replica-sync --config /etc/github-forgejo-replica/config.json --metrics-only
ReadWritePaths=
ReadWritePaths=/var/lib/github-forgejo-replica /var/lib/node_exporter/textfile_collector
TimeoutStartSec=15min
TimeoutStopSec=30s
MemoryMax=512M
UMask=0077
